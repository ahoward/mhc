<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Overpass Mono';
    font-weight: 700;
    font-style: normal;
    src: url('fonts/OverpassMono-Bold.ttf') format('truetype');
  }
  :root {
    --fireweed: #C81E6E;
    --glacier:  #1A9CB5;
    --sun:      #D99209;
  }
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
  }
  body {
    width: 512px;
    height: 512px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Overpass Mono', monospace;
    font-weight: 700;
    font-size: 320px;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .mark .m { color: var(--fireweed); }
  .mark .t { color: var(--glacier); }
  .mark .n { color: var(--sun); }
</style>
</head>
<body>
  <div class="mark"><span class="m">m</span><span class="t">t</span><span class="n">&#x207F;</span></div>
</body>
</html>
