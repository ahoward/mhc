<html>
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Major+Mono+Display">

    <style>
      :root {
        --fireweed: #C81E6E;
        --glacier: #1A9CB5;
        --sun: #D99209;
        --basalt: #1C1C1E;
      }
      body {
        font-family: 'Major Mono Display', monospace;
        font-size: 420px;
        background: var(--basalt);
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .mark {
        line-height: 1;
      }
      .mark .m { color: var(--fireweed); }
      .mark .t { color: var(--glacier); }
      .mark .sup {
        color: var(--sun);
        font-size: 0.5em;
        vertical-align: super;
      }
    </style>
  </head>

  <body>
    <div class="mark"><span class="m">m</span><span class="t">t</span><span class="sup">ⁿ</span></div>
  </body>
</html>
