<html>
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Major+Mono+Display">

    <style>
      :root {
        --fireweed: #C9377A;
        --glacier: #6FB3C4;
        --basalt: #1C1C1E;
      }
      body {
        font-family: 'Major Mono Display', monospace;
        font-size: 420px;
        background: var(--basalt);
        color: var(--glacier);
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .mark {
        line-height: 1;
      }
      .mark .sup {
        color: var(--fireweed);
        font-size: 0.5em;
        vertical-align: super;
      }
    </style>
  </head>

  <body>
    <div class="mark">mt<span class="sup">ⁿ</span></div>
  </body>
</html>
